<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#647b96"/></marker></defs><path d="M515.0,105 L515.0,165" stroke="#647b96" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="523.0" y="127.0" font-size="14" fill="#38506b">진단</text><path d="M515.0,255 L185.0,330" stroke="#647b96" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="358.0" y="284.5" font-size="14" fill="#38506b">통과</text><path d="M515.0,255 L555.0,330" stroke="#647b96" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="543.0" y="284.5" font-size="14" fill="#38506b">규칙 위반</text><path d="M515.0,255 L925.0,330" stroke="#647b96" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="728.0" y="284.5" font-size="14" fill="#38506b">중복·이전 개정</text><path d="M185.0,420 L370.0,510" stroke="#647b96" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="285.5" y="457.0" font-size="14" fill="#38506b">최종 상태</text><path d="M925.0,420 L370.0,510" stroke="#647b96" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="655.5" y="457.0" font-size="14" fill="#38506b">유효 작업 이력</text><rect x="350" y="15" width="330" height="90" rx="9" fill="#edf3fc" stroke="#2457a6"/><text x="364" y="42" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="16" fill="#203249">원본 수신과 보존</text><text x="364" y="65" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">물리 행 ID와 원본 파일 추적</text><text x="364" y="88" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">검수 원천·조인 통합본은 별도 보존</text><rect x="350" y="165" width="330" height="90" rx="9" fill="#edf3fc" stroke="#2457a6"/><text x="364" y="192" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="16" fill="#203249">표준 사전과 품질 규칙</text><text x="364" y="215" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">마스터 참조·단위·시각·충돌 검사</text><text x="364" y="238" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">사전·합의 정책에 근거해 분류</text><rect x="40" y="330" width="290" height="90" rx="9" fill="#edf3fc" stroke="#2457a6"/><text x="54" y="357" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="16" fill="#203249">정상 최종 상태</text><text x="54" y="380" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">각 검수 ID의 최고 유효 개정</text><text x="54" y="403" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">위험 분석의 기준</text><rect x="410" y="330" width="290" height="90" rx="9" fill="#edf3fc" stroke="#2457a6"/><text x="424" y="357" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="16" fill="#203249">격리와 감사</text><text x="424" y="380" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">오류 행과 근거를 함께 보존</text><text x="424" y="403" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">동일 개정 충돌은 양쪽 격리</text><rect x="780" y="330" width="290" height="90" rx="9" fill="#edf3fc" stroke="#2457a6"/><text x="794" y="357" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="16" fill="#203249">제외 이력</text><text x="794" y="380" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">동일 내용 중복과 과거 유효 개정</text><text x="794" y="403" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">과거 유효 개정은 작업량에 활용</text><rect x="40" y="510" width="660" height="90" rx="9" fill="#edf3fc" stroke="#2457a6"/><text x="54" y="537" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="16" fill="#203249">분석과 예측</text><text x="54" y="560" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">최종 상태의 위험 분석 / 유효 작업 이력의 작업량 분석</text><text x="54" y="583" font-family="NanumGothic,Malgun Gothic,sans-serif" font-size="13" fill="#203249">예측 시각 경계 및 평가 구간을 분리</text></svg>